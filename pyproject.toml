[project]
name = "repo-relationship-graph"
version = "0.1.0"
requires-python = ">=3.12"
description = "Repository relationship graph engine and Codex plugin assets."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
